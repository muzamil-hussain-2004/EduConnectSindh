services:
  - type: web
    name: educonnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set these in the Render dashboard (never commit them):
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        sync: false
